[project]
name = "pte-plugin-auto-annotation"
dynamic = ["version"]
description = "Evaluates LLMs at correcting GROBID training annotations against gold versions (model probe)"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = []

[project.urls]
Repository = "https://github.com/mpilhlt/pte-plugins"

[project.entry-points."pte.plugins"]
auto-annotation = "pte_plugin_auto_annotation"

[project.scripts]
pte-model-probe = "pte_plugin_auto_annotation.probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_auto_annotation/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_auto_annotation"]
exclude = ["src/pte_plugin_auto_annotation/tests"]
